name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Compile
        run: mvn -B -q clean compile

      # Unit test không cần MySQL - chạy được trên CI.
      # Integration test cần MySQL + server, xem README mục "Chạy test".
      - name: Unit test
        run: mvn -B test