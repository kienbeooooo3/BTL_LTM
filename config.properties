# Cấu hình server Bomb Guess Online
# File này được đọc khi khởi động GameServer. Có thể ghi đè bằng system property:
#   java -Ddb.pass=matkhau -Dgame.port=9999 -cp ... com.bombgame.server.GameServer

# --- Cơ sở dữ liệu MySQL ---
db.url=jdbc:mysql://localhost:3306/bombgame
db.user=root
db.pass=1234

# --- Cổng lắng nghe của server ---
game.port=9999

# --- Logging ---
# Mức tối thiểu: DEBUG | INFO | WARN | ERROR
log.level=INFO
# Thư mục lưu log theo ngày (tên file: bombgame-YYYY-MM-DD.log)
log.dir=logs
